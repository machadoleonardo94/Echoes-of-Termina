; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html



[env]
; Settings shared by every hardware variant. There is deliberately no `board`
; or partition table here: each variant describes its own hardware in boards/
; and selects its own partition table, so an env cannot silently inherit the
; wrong flash size.
platform = espressif32 @6.12.0
framework = arduino
upload_speed = 921600
monitor_speed = 115200
board_upload.wait_for_upload_port = yes
; A2DP: use the library's legacy I2S output path (no AudioTools). Defining
; A2DP_I2S_AUDIOTOOLS=0 documents that choice and silences the library's
; "AudioTools library is not included first or installed" warning — every
; AudioTools-dependent code path is already guarded by that macro.
build_flags = "-Os"
	 -DCORE_DEBUG_LEVEL=1
; -DAUDIO_LOG (verbose ESP32-audioI2S trace) served its purpose: it showed the
; decoder parsing the file correctly. Keep it off unless debugging the player.
;	 -DAUDIO_LOG
	 -DA2DP_LEGACY_I2S_SUPPORT=1
	 -DA2DP_I2S_AUDIOTOOLS=0
	 -DDEFAULT_FTP_SERVER_NETWORK_TYPE_ESP32=NETWORK_ESP32
; Button input tracing — services/buttons.h logs every raw edge and a 5 s
; idle-level census for both buttons when BUTTON_TRACE is 1, and services/
; controls.h then refuses the three actions that would end a test session (mode
; switch, reboot, standalone show). It defaults to 0 inside buttons.h; the
; diagnostic env [env:echoes-v1-btn] is what turns it on, so this flag is NOT set
; here (defining it in both places makes the compiler warn about a redefinition).
	 -DDEFAULT_STORAGE_TYPE_ESP32=STORAGE_SD_MMC
; The microSD throughput benchmark is a diagnostic, NOT a shared flag: it
; writes to the card and costs ~1-2 s at every boot, so release images stay
; clean. Enable it with the [env:marajoara-v3-bench] variant below; see
; components/SDCARD/features/sd_benchmark.h.
; 1 kHz tone through the raw IDF I2S driver at boot — see
; components/ESP32/features/i2s_output_test.h. It proved the output stage good
; (tone heard in both modes), so it is off; set to 1 to re-run that check.
	 -DI2S_TEST_BEEP=0
lib_deps = 
	Wire
	SPI
	tzapu/WiFiManager@^2.0.17
	https://github.com/pschatzmann/ESP32-A2DP.git#main
	adafruit/Adafruit NeoPixel@^1.12.0
	adafruit/Adafruit BusIO@^1.14.5
	adafruit/Adafruit GFX Library@^1.11.9
	adafruit/Adafruit SSD1306@^2.5.7
	esphome/ESP32-audioI2S@^2.3.0
	xreef/SimpleFTPServer@^3.0.1

[env:echoes-v1]
; Echoes V1 bench board, ESP32-WROOM-32 N8R2 module (8 MB flash + 2 MB PSRAM).
; Its I2S DAC sits on GPIO16/17/18, which are the module's PSRAM CS/CLK pins, so
; this build must run with PSRAM disabled (see src/shared/pinout.h).
board = esp32-n8r2
board_build.partitions = partitions_8mb.csv
build_flags = ${env.build_flags} -DECHOES_V1
upload_protocol = espota
upload_port = echoes.local
; OTA requires the board to be in WiFi mode — in Bluetooth mode the radio is off
; and no OTA server was ever started, so espota simply gets no answer. The mDNS
; name above is the intended address, but resolving it for the UDP invitation
; proved unreliable from the bench host (the portal answered on the same board at
; the same moment): the flash only went through by IP. Reach for
;     python -m platformio run -e echoes-v1 -t upload --upload-port <ip>
; when the name-based upload reports "Sending invitation to echoes.local failed".
;
; COM7 is MONITOR-ONLY with this FTDI FT232 setup: its DTR/RTS are not wired to
; EN/GPIO0, so esptool can never put the chip into download mode. Measured — the
; board keeps running through any line-control sequence, and esptool reports
; "No serial data received". Use it for `tools/serial_capture.py` and flash over OTA.
lib_deps = 
	${env.lib_deps}

[env:echoes-v1-btn]
; Diagnostic twin of echoes-v1 for verifying BUTTON INPUT — same board, same
; partition table, same pinout, and it uploads over the same OTA port, so it is a
; drop-in flash and a drop-in way back. The only difference is -DBUTTON_TRACE=1:
; every raw edge on both buttons is logged, a 5 s line reports the idle level of
; each pin (which is how a dead or mis-wired wire is told from a misread press),
; and the destructive gestures are logged instead of performed.
extends = env:echoes-v1
build_flags = ${env:echoes-v1.build_flags} -DBUTTON_TRACE=1

[env:marajoara-v3]
; Marajoara_V3, ESP32-WROOM-32UE module (8 MB flash + 2 MB PSRAM).
; Its I2S lives on GPIO18/25/26/34 and leaves GPIO16/17 to the PSRAM, so PSRAM
; stays enabled here.
board = esp32-n8r2
board_build.partitions = partitions_8mb.csv
build_flags = ${env.build_flags} -DMARAJOARA_V3
lib_deps = 
	${env.lib_deps}

[env:marajoara-v3-bench]
; Diagnostic twin of marajoara-v3 for the one-shot microSD throughput
; benchmark — see components/SDCARD/features/sd_benchmark.h. Use it while the
; 1-bit bus on Marajoara_V3 is being measured, then flash marajoara-v3 back.
extends = env:marajoara-v3
build_flags = ${env:marajoara-v3.build_flags} -DSD_BENCHMARK=1

[env:esp32-N16]
; ESP32-WROOM-32 N16: 16 MB flash, no PSRAM. Uses the Echoes V1 pinout.
board = esp32-n16
board_build.partitions = partitions_16mb.csv
build_flags = ${env.build_flags} -DECHOES_V1
upload_protocol = espota
upload_port = 192.168.2.140
lib_deps = 
	${env.lib_deps}


[platformio]
description = Echoes of Termina Bluetooth Speaker V0.1